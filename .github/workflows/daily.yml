name: Daily Update

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）跑一次
    - cron: "0 2 * * *"
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write  # 允许提交更新

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect arXiv (90 days backfill)
        run: |
          # CI runner 是无状态的：data/ 不入库，每次都重新爬最近 90 天，
          # 保证 arXiv 数据每天滚动更新，而不是冻结在首次运行。
          python pipeline/backfill.py 90

      - name: Merge sources (RSS/HTML/GitHub)
        run: python pipeline/merge_sources.py

      # 可选：AI 摘要 + 方向综述（需要在 repo settings 配置 LLM_API_KEY secret）
      - name: Generate AI summaries & briefings
        env:
          LLM_PROVIDER: deepseek
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -n "$LLM_API_KEY" ]; then
            python pipeline/gen_summaries.py 10 || echo "摘要生成失败，跳过"
            python -m pipeline.gen_briefing || echo "方向综述生成失败，跳过"
            python -m pipeline.gen_event_briefs || echo "事件解读生成失败，跳过"
            python -m pipeline.gen_weekly_intro || echo "本周导读生成失败，跳过"
          else
            echo "未配置 LLM_API_KEY，跳过 AI 摘要/综述"
          fi

      - name: Generate HTML
        run: python generate_html.py

      - name: Generate weekly report
        run: python pipeline/weekly_report.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ output/
          git diff --staged --quiet || git commit -m "chore: daily update $(date +%Y-%m-%d)"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          force_orphan: true
