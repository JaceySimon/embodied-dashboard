# 具身智能看板 - 白名单源清单
# 所有源按 L0/L1/L2 分级，不在清单内的源默认不收
# 维护人：每周检查一次链接有效性

# ============ L0: 一手原始（全量收录） ============
l0:
  arxiv:
    # 分页拉取：每组查询按 submittedDate 倒序分页，直到结果早于 lookback 窗口
    # 解决旧版「单一大查询 totalResults=7万+，max_results 截断导致只覆盖最近几天」的召回问题
    page_size: 100
    delay_seconds: 3.0
    max_per_query: 3000      # 每个拆分查询的拉取上限（库按 page_size 自动分页，避免长尾截断）
    keyword_chunk: 7         # 每个查询最多拼几个关键词，避免 arXiv API 复杂查询 500
    # 分层召回：A 核心方向（cs.RO）+ B 其他分类强具身词 + C 重点公司/系统定向追踪
    query_groups:
      # A. 机器人主分类 cs.RO + VLA/世界模型/仿真/具身/操作 核心方向词
      - name: ro_vla
        categories: ["cs.RO"]
        keywords:
          - "vision-language-action"
          - "VLA"
          - "vision language action"
          - "robot foundation model"
          - "robot policy"
          - "diffusion policy"
          - "flow matching policy"
      - name: ro_world_model
        categories: ["cs.RO"]
        keywords:
          - "world model"
          - "world action model"
          - "world-action"
          - "video prediction"
          - "action model"
          - "visual simulation"
          - "world foundation model"
      - name: ro_embodied_sim
        categories: ["cs.RO"]
        keywords:
          - "embodied"
          - "sim-to-real"
          - "sim2real"
          - "humanoid"
          - "robot learning"
          - "imitation learning"
          - "teleoperation"
      - name: ro_manipulation
        categories: ["cs.RO"]
        keywords:
          - "manipulation policy"
          - "dexterous manipulation"
          - "robot manipulation"
          - "manipulation"
          - "locomotion"
          - "simulation"
          - "simulator"
      # B. 主分类不在 cs.RO、但确实是具身/VLA 的论文（强短语，避免引入纯 NLP/CV 噪音）
      - name: vla_other_cats
        categories: ["cs.AI", "cs.LG", "cs.CV", "cs.CL"]
        keywords:
          - "vision-language-action"
          - "VLA"
          - "robot foundation model"
          - "embodied AI"
          - "world action model"
      # C. 重点公司/系统定向追踪：结果少而精准，确保其技术报告论文不被大查询截断漏掉
      # 一律限定 cs.RO（cat 匹配主+副分类），过滤 cosmos 天文、pi0 粒子物理等同名噪音
      - name: track_companies
        restrict_robot_cat: true
        entities:
          - "agibot"
          - "galbot"
          - "robotera"
          - "engineai"
          - "limx"
          - "apptronik"
          - "ubtech"
          - "Fourier Intelligence"
          - "skild"
          - "sanctuary"
          - "1x technologies"
      - name: track_systems
        restrict_robot_cat: true
        entities:
          - "GR00T"
          - "cosmos"
          - "π0"
          - "Astra"
          - "Helix"
          - "DROID"
          - "X-embodiment"
          - "Isaac Sim"
    # 旧字段保留供向后兼容（新逻辑以 query_groups 为准）
    categories:
      - cs.RO
      - cs.AI
      - cs.LG
      - cs.CV
      - cs.CL
    keywords:
      - "vision-language-action"
      - "VLA"
      - "world model"
      - "embodied"
      - "robot foundation model"
      - "robot policy"
      - "diffusion policy"
    max_results_per_day: 100
    sort_by: submittedDate
    sort_order: descending

  openreview:
    venues:
      - CoRL
      - RSS
      - ICRA
      - ICLR
      - NeurIPS
      - ICML
    enabled: false  # v2 启用

  huggingface:
    enabled: false  # v2 启用

  github:
    enabled: false  # v2 启用

# ============ L1: 一手发布（白名单） ============
l1:
  # 重点实验室白名单（只追踪这些）
  key_labs:
    - name: "Physical Intelligence"
      keywords: ["π0", "pi0", "VLA", "flow matching", "general robot"]
      enabled: true

    - name: "Google DeepMind"
      keywords: ["RT-2", "RT-X", "robot foundation model", "vision-language-action"]
      enabled: true

    - name: "Stanford SVL"
      keywords: ["Olivia", "mobile manipulation", "VLN", "vision-language-navigation"]
      enabled: true

    - name: "UC Berkeley BAIR"
      keywords: ["DROID", "distributed robot", "open X-embodiment"]
      enabled: true

    - name: "NVIDIA Research"
      keywords: ["Isaac Sim", "world foundation model", "Cosmos"]
      enabled: true

    - name: "MIT CSAIL"
      keywords: ["transformer policy", "diffusion policy", "manipulation"]
      enabled: true

  labs:
    - name: "Google DeepMind Research"
      url: "https://deepmind.google/discover/blog/"
      rss: "https://deepmind.google/blog/rss.xml"
      region: "UK"
      keywords: ["robot", "robotics"]
      enabled: true

    - name: "NVIDIA Research Blog"
      url: "https://blogs.nvidia.com/research/"
      rss: "https://blogs.nvidia.com/feed/"
      region: "US"
      keywords: ["robot", "robotics", "Isaac", "GR00T", "Cosmos"]
      enabled: true

    - name: "Stanford Vision and Learning Lab"
      url: "https://svl.stanford.edu/blog/"
      rss: null
      region: "US"
      enabled: false

    - name: "Meta AI Research"
      url: "https://ai.meta.com/research/"
      rss: null
      region: "US"
      enabled: false

    - name: "Berkeley BAIR"
      url: "https://bair.berkeley.edu/"
      rss: "https://bair.berkeley.edu/blog/feed.xml"
      region: "US"
      keywords: ["robot", "robotics", "manipulation", "policy", "embodied", "vision-language", "control"]
      enabled: true

  companies:
    # 以下公司 RSS URL 无效，v2 需找正确 URL
    - name: "Figure AI"
      url: "https://www.figure.ai/news"
      rss: null
      region: "US"
      type: "humanoid"
      enabled: false

    - name: "Physical Intelligence"
      url: "https://www.physicalintelligence.company/blog"
      rss: null
      region: "US"
      type: "VLA"
      enabled: false

    - name: "Skild AI"
      url: "https://www.skild.ai/blog"
      rss: null
      region: "US"
      type: "VLA"
      enabled: false

    - name: "1X Technologies"
      url: "https://www.1x.tech/blog/"
      rss: null  # 404
      region: "NO"
      type: "humanoid"
      enabled: false

    - name: "Boston Dynamics"
      url: "https://www.bostondynamics.com/blog"
      rss: null  # 404，改走 HTML 采集器
      region: "US"
      type: "humanoid"
      enabled: false

    - name: "Sanctuary AI"
      url: "https://sanctuary.ai/news/"
      rss: "https://sanctuary.ai/feed/"
      region: "CA"
      type: "humanoid"
      enabled: true

  # 无 RSS 的公司，用 HTML 采集器抓取新闻列表页
  html_companies:
    - name: "Physical Intelligence"
      list_url: "https://www.pi.website/blog"
      link_pattern: '/blog/[a-z0-9-]+'
      region: "US"
      enabled: true

    - name: "Figure AI"
      list_url: "https://www.figure.ai/news"
      link_pattern: '/news/[a-z0-9-]+'
      region: "US"
      enabled: true

    - name: "1X Technologies"
      list_url: "https://www.1x.tech/discover"
      link_pattern: '/discover/[a-z0-9-]+'
      region: "NO"
      enabled: true

    - name: "Skild AI"
      list_url: "https://skild.ai/blogs"
      link_pattern: '/blogs/[a-z0-9-]+'
      region: "US"
      enabled: true

    - name: "Boston Dynamics"
      list_url: "https://bostondynamics.com/blog/"
      link_pattern: '/blog/[a-z0-9-]+'
      region: "US"
      max_articles: 15
      enabled: true

    - name: "Agility Robotics"
      list_url: "https://www.agilityrobotics.com/press-releases"
      link_pattern: '/content/[a-z0-9-]+'
      region: "US"
      max_articles: 15
      enabled: true

    - name: "智元机器人 AgiBot"
      list_url: "https://www.agibot.com/news"
      link_pattern: '/article/\d+/detail/\d+\.html'
      page_url: "https://www.agibot.com/news?page={page}"
      max_pages: 6
      mode: "list"
      max_articles: 40
      region: "CN"
      enabled: true

    - name: "逐际动力 LimX"
      list_url: "https://www.limxdynamics.com/zh/news"
      link_pattern: '/zh/news/BK\d+'
      mode: "list"
      max_articles: 20
      region: "CN"
      enabled: true

    - name: "银河通用 Galbot"
      list_url: "https://www.galbot.com/news/"
      mode: "nuxt_payload"
      max_articles: 30
      region: "CN"
      enabled: true

    - name: "宇树科技 Unitree"
      list_url: "https://www.unitree.com/news/"
      link_pattern: '/news/\d+'
      mode: "list"
      max_articles: 20
      region: "CN"
      enabled: true

    - name: "众擎机器人 EngineAI"
      list_url: "https://www.engineai.com.cn/about-news.html"
      link_pattern: '/about-news-media/\d+\.html'
      mode: "list"
      max_articles: 20
      region: "CN"
      enabled: true

    - name: "星动纪元 RobotEra"
      list_url: "https://www.robotera.com/prod-api/api/v1/robotera/getNewsList"
      mode: "json_api"
      json_api:
        params: {site: 1, isShow: 0}
        page_param: "pageNum"
        size_param: "pageSize"
        list_path: "data.list"
        total_path: "data.total"
        title_field: "title"
        url_field: "externalLink"
        date_field: "publishTime"
        max_pages: 3
      max_articles: 40
      region: "CN"
      enabled: true

  chinese_companies:
    - name: "智元机器人 AgiBot"
      url: "https://www.agibot.com/"
      rss: null
      region: "CN"
      enabled: false

    - name: "宇树科技 Unitree"
      url: "https://www.unitree.com/"
      rss: null
      region: "CN"
      enabled: false

