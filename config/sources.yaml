# 具身智能看板 - 白名单源清单
# 所有源按 L0/L1/L2 分级，不在清单内的源默认不收
# 维护人：每周检查一次链接有效性

# ============ L0: 一手原始（全量收录） ============
l0:
  arxiv:
    categories:
      - cs.RO    # Robotics
      - cs.AI    # Artificial Intelligence
      - cs.LG    # Machine Learning
      - cs.CV    # Computer Vision
      - cs.CL    # Computation and Language
    keywords:
      # 收窄：只收 VLA / 世界模型 / 仿真器三类
      - "vision-language-action"
      - "VLA"
      - "vision language action"
      - "world model"
      - "world models"
      - "simulator"
      - "simulation"
      - "sim-to-real"
      - "sim2real"
      - "embodied"
      - "robot foundation model"
      - "robot policy"
      - "diffusion policy"
    max_results_per_day: 100
    sort_by: submittedDate
    sort_order: descending

  openreview:
    venues:
      - CoRL
      - RSS
      - ICRA
      - ICLR
      - NeurIPS
      - ICML
    enabled: false  # v2 启用

  huggingface:
    enabled: false  # v2 启用

  github:
    enabled: false  # v2 启用

# ============ L1: 一手发布（白名单） ============
l1:
  # 重点实验室白名单（只追踪这些）
  key_labs:
    - name: "Physical Intelligence"
      keywords: ["π0", "pi0", "VLA", "flow matching", "general robot"]
      enabled: true

    - name: "Google DeepMind"
      keywords: ["RT-2", "RT-X", "robot foundation model", "vision-language-action"]
      enabled: true

    - name: "Stanford SVL"
      keywords: ["Olivia", "mobile manipulation", "VLN", "vision-language-navigation"]
      enabled: true

    - name: "UC Berkeley BAIR"
      keywords: ["DROID", "distributed robot", "open X-embodiment"]
      enabled: true

    - name: "NVIDIA Research"
      keywords: ["Isaac Sim", "world foundation model", "Cosmos"]
      enabled: true

    - name: "MIT CSAIL"
      keywords: ["transformer policy", "diffusion policy", "manipulation"]
      enabled: true

  labs:
    - name: "Google DeepMind Research"
      url: "https://deepmind.google/discover/blog/"
      rss: "https://deepmind.google/blog/rss.xml"
      region: "UK"
      keywords: ["robot", "robotics"]
      enabled: true

    - name: "NVIDIA Research Blog"
      url: "https://blogs.nvidia.com/research/"
      rss: "https://blogs.nvidia.com/feed/"
      region: "US"
      keywords: ["robot", "robotics", "Isaac", "GR00T", "Cosmos"]
      enabled: true

    - name: "Stanford Vision and Learning Lab"
      url: "https://svl.stanford.edu/blog/"
      rss: null
      region: "US"
      enabled: false

    - name: "Meta AI Research"
      url: "https://ai.meta.com/research/"
      rss: null
      region: "US"
      enabled: false

    - name: "Berkeley BAIR"
      url: "https://bair.berkeley.edu/"
      rss: "https://bair.berkeley.edu/blog/feed.xml"
      region: "US"
      keywords: ["robot", "robotics", "manipulation", "policy", "embodied", "vision-language", "control"]
      enabled: true

  companies:
    # 以下公司 RSS URL 无效，v2 需找正确 URL
    - name: "Figure AI"
      url: "https://www.figure.ai/news"
      rss: null
      region: "US"
      type: "humanoid"
      enabled: false

    - name: "Physical Intelligence"
      url: "https://www.physicalintelligence.company/blog"
      rss: null
      region: "US"
      type: "VLA"
      enabled: false

    - name: "Skild AI"
      url: "https://www.skild.ai/blog"
      rss: null
      region: "US"
      type: "VLA"
      enabled: false

    - name: "1X Technologies"
      url: "https://www.1x.tech/blog/"
      rss: null  # 404
      region: "NO"
      type: "humanoid"
      enabled: false

    - name: "Boston Dynamics"
      url: "https://www.bostondynamics.com/blog"
      rss: null  # 404，改走 HTML 采集器
      region: "US"
      type: "humanoid"
      enabled: false

    - name: "Sanctuary AI"
      url: "https://sanctuary.ai/news/"
      rss: "https://sanctuary.ai/feed/"
      region: "CA"
      type: "humanoid"
      enabled: true

  # 无 RSS 的公司，用 HTML 采集器抓取新闻列表页
  html_companies:
    - name: "Physical Intelligence"
      list_url: "https://www.pi.website/blog"
      link_pattern: '/blog/[a-z0-9-]+'
      region: "US"
      enabled: true

    - name: "Figure AI"
      list_url: "https://www.figure.ai/news"
      link_pattern: '/news/[a-z0-9-]+'
      region: "US"
      enabled: true

    - name: "1X Technologies"
      list_url: "https://www.1x.tech/discover"
      link_pattern: '/discover/[a-z0-9-]+'
      region: "NO"
      enabled: true

    - name: "Skild AI"
      list_url: "https://skild.ai/blogs"
      link_pattern: '/blogs/[a-z0-9-]+'
      region: "US"
      enabled: true

    - name: "Boston Dynamics"
      list_url: "https://bostondynamics.com/blog/"
      link_pattern: '/blog/[a-z0-9-]+'
      region: "US"
      max_articles: 15
      enabled: true

    - name: "Agility Robotics"
      list_url: "https://www.agilityrobotics.com/press-releases"
      link_pattern: '/content/[a-z0-9-]+'
      region: "US"
      max_articles: 15
      enabled: true

    - name: "智元机器人 AgiBot"
      list_url: "https://www.agibot.com/news"
      link_pattern: '/article/\d+/detail/\d+\.html'
      page_url: "https://www.agibot.com/news?page={page}"
      max_pages: 6
      mode: "list"
      max_articles: 40
      region: "CN"
      enabled: true

  chinese_companies:
    - name: "智元机器人 AgiBot"
      url: "https://www.agibot.com/"
      rss: null
      region: "CN"
      enabled: false

    - name: "宇树科技 Unitree"
      url: "https://www.unitree.com/"
      rss: null
      region: "CN"
      enabled: false

    - name: "银河通用 Galbot"
      url: "https://www.galbot.com/"
      rss: null
      region: "CN"
      enabled: false

  x_whitelist:
    enabled: false  # 公共 RSSHub 实例跑不通，v2 用 X 官方 API
    accounts:
      - "@sergey_levine"
      - "@chelseafinn"
      - "@pathak22"
      - "@shuran_song"
      - "@pabbeel"
      - "@Figure_robot"
      - "@PhysicalIntell"
      - "@UnitreeRobotics"
      - "@AgibotTech"

# ============ L2: 二手权威（仅挂事件） ============
l2:
  media:
    - name: "The Robot Report"
      url: "https://www.therobotreport.com/"
      rss: null  # Cloudflare 403
      region: "US"
      enabled: false

    - name: "IEEE Spectrum Robotics"
      url: "https://spectrum.ieee.org/robotics"
      rss: "https://spectrum.ieee.org/feeds/topic/robotics.rss"
      region: "US"
      enabled: true

    - name: "TechCrunch Robotics"
      url: "https://techcrunch.com/category/robotics/"
      rss: "https://techcrunch.com/category/robotics/feed/"
      region: "US"
      enabled: true

    - name: "机器之心"
      url: "https://www.jiqizhixin.com/"
      rss: null  # 网站返回 HTML 不是 RSS
      region: "CN"
      enabled: false

    - name: "量子位"
      url: "https://www.qbitai.com/"
      rss: "https://www.qbitai.com/feed"
      region: "CN"
      keywords: ["机器人", "具身", "人形"]
      enabled: true

# ============ 全局配置 ============
global:
  lookback_days: 7

  dedup:
    minhash_threshold: 0.6
    embedding_threshold: 0.85

  aggregation:
    primary_source_priority:
      - "l0_arxiv"
      - "l0_tech_report"
      - "l1_company_blog"
      - "l1_author_x"
      - "l2_media"

  output:
    format: json
    dir: "data/processed"
