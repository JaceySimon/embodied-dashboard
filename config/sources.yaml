# ============ 全局配置 ============
global:
  lookback_days: 7

  dedup:
    minhash_threshold: 0.6
    embedding_threshold: 0.85

  aggregation:
    primary_source_priority:
      - "l0_arxiv"
      - "l0_tech_report"
      - "l1_company_blog"
      - "l1_author_x"
      - "l2_media"

  output:
    format: json
    dir: "data/processed"
